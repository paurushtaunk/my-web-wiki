<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Web Wiki — Paurush M Taunk</title>
  <style>
    /* Design tokens */
    :root{
      --bg-0:#071021; --bg-1:#0d1624; --card:#091524; --muted:#9fb4c1; --accent:#66d3ff; --accent-2:#2dd4bf; --glass:rgba(255,255,255,0.04); --radius:12px; --maxw:1100px; --text:#e8f6fb;
    }
    [data-theme="light"]{
      --bg-0:#f8fafc; --bg-1:#f1f5f9; --card:#ffffff; --muted:#52606d; --accent:#0369a1; --accent-2:#0ea5a4; --glass:rgba(2,6,23,0.03); --text:#061226;
    }

    /* Base */
    *{box-sizing:border-box}
    html,body{height:100%;}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;background:linear-gradient(180deg,var(--bg-0),var(--bg-1));color:var(--text);-webkit-font-smoothing:antialiased}

    /* Layout */
    .wrap{max-width:var(--maxw);margin:36px auto;padding:20px;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
    .sidebar{background:var(--glass);backdrop-filter:blur(6px);padding:18px;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.03);height:calc(100vh - 72px);position:sticky;top:36px;overflow:auto}
    .main{padding:18px;border-radius:var(--radius);background:transparent;min-height:60vh}

    /* Sidebar content */
    .profile{display:flex;align-items:center;gap:12px}
    .avatar{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#002127;font-weight:700;font-size:18px;box-shadow:0 6px 20px rgba(2,10,20,0.4)}
    h1{font-size:1.05rem;margin:0}
    .subtitle{color:var(--muted);font-size:0.92rem;margin-top:6px}

    .search{margin-top:18px}
    .search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);background:rgba(255,255,255,0.02);color:inherit}

    /* Main post card */
    .post-card{background:var(--card);padding:26px;border-radius:14px;box-shadow:0 10px 30px rgba(2,8,20,0.5);border:1px solid rgba(255,255,255,0.03);}
    .post-card h2{margin:0 0 8px 0;font-size:1.25rem}
    .meta{color:var(--muted);font-size:0.92rem;margin-bottom:14px}
    .post-card p{line-height:1.6;color:var(--text);margin:0 0 12px}

    .quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .chip{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:0.9rem}

    .readmore{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#002127;font-weight:700;text-decoration:none;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(45,212,191,0.08);transition:transform .14s ease,opacity .14s ease}
    .readmore:hover{transform:translateY(-4px);opacity:0.98}

    /* Theme control */
    .theme-control{position:fixed;top:16px;right:16px;z-index:1200}
    .theme-select{background:transparent;border:1px solid rgba(255,255,255,0.05);color:var(--text);padding:8px 12px;border-radius:10px}

    /* Responsive */
    @media (max-width:980px){.wrap{grid-template-columns:1fr;padding:16px}.sidebar{position:relative;height:auto;margin-bottom:12px;top:0}}

    /* Accessibility helpers */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <div class="theme-control">
    <label for="theme-select" class="sr-only">Choose theme</label>
    <select id="theme-select" class="theme-select" aria-label="Choose theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="wrap">
    <aside class="sidebar" aria-label="Site navigation">
      <div class="profile">
        <div class="avatar">PMT</div>
        <div>
          <h1>Paurush M Taunk</h1>
          <div class="subtitle">my-web-wiki</div>
        </div>
      </div>

      <div class="search" role="search">
        <input id="search" placeholder="Search posts..." aria-label="Search posts" />
      </div>

    </aside>

    <main class="main">
      <div class="post-card" id="post-1" data-title="Getting started with my-web-wiki" data-excerpt="How to get started publishing notes and short posts using GitHub Pages.">
        <h2>Agent Steering and Skills with Amazon Kiro</h2>
        <div class="meta">Jul 16, 2026 · Guide · by Paurush M Taunk</div>
        <a class="readmore" href="posts/agent-steering-and-skills.html">Read full post →</a>
      </div>
    </main>
  </div>

  <script>
    // Theme handling: 'system' | 'light' | 'dark'
    (function(){
      const select = document.getElementById('theme-select');
      const storageKey = 'site-theme-preference';
      const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme(pref){
        if(pref === 'system'){
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', pref);
        }
      }
      function readStored(){ return localStorage.getItem(storageKey) || 'system'; }
      function store(pref){ if(pref === 'system') localStorage.removeItem(storageKey); else localStorage.setItem(storageKey, pref); }
      const stored = readStored(); select.value = stored; applyTheme(stored);
      select.addEventListener('change', (e)=>{ const v = e.target.value; store(v); applyTheme(v); });
      function handleSystemChange(){ if(readStored() === 'system') applyTheme('system'); }
      if(mq){ if(typeof mq.addEventListener === 'function') mq.addEventListener('change', handleSystemChange); else if(typeof mq.addListener === 'function') mq.addListener(handleSystemChange); }
    })();

    // Search: simple filter for single post (keeps visible if matches)
    (function(){
      const input = document.getElementById('search');
      const post = document.getElementById('post-1');
      input.addEventListener('input', e => {
        const q = e.target.value.toLowerCase().trim();
        const title = (post.dataset.title || '').toLowerCase();
        const excerpt = (post.dataset.excerpt || '').toLowerCase();
        const show = q === '' || title.includes(q) || excerpt.includes(q);
        post.style.display = show ? '' : 'none';
      });
    })();
  </script>
</body>
</html>
