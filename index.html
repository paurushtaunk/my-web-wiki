<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Web Wiki — Paurush M Taunk</title>
  <style>
    :root{--bg:#061224;--card:#071826;--panel:#0f1b26;--muted:#9ca3af;--accent:#7dd3fc;--text:#e6eef6}
    @media (prefers-color-scheme: light){:root{--bg:#f6f8fb;--card:#ffffff;--panel:#f1f5f9;--muted:#475569;--accent:#0369a1;--text:#0b1220}}
    [data-theme="dark"]{--bg:#061224;--card:#071826;--panel:#0f1b26;--muted:#9ca3af;--accent:#7dd3fc;--text:#e6eef6}
    [data-theme="light"]{--bg:#f6f8fb;--card:#ffffff;--panel:#f1f5f9;--muted:#475569;--accent:#0369a1;--text:#0b1220}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;background:var(--bg);color:var(--text);min-height:100vh}
    .container{max-width:1100px;margin:28px auto;padding:20px;display:grid;grid-template-columns:260px 1fr;gap:20px}
    .theme-control{position:fixed;top:12px;right:12px;z-index:1200}
    .theme-select{background:var(--card);color:var(--text);border:1px solid rgba(0,0,0,0.08);padding:8px 10px;border-radius:8px;font-weight:600}
    .sidebar{background:rgba(255,255,255,0.03);border-radius:12px;padding:18px;height:calc(100vh - 96px);position:sticky;top:20px;overflow:auto}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:12px}
    .logo{width:44px;height:44px;background:linear-gradient(135deg,#06293a,#045d7a);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-weight[...]
    h1{font-size:1.05rem;margin:0}
    .muted{color:var(--muted);font-size:0.92rem}
    .search{margin-top:16px}
    .search input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);background:transparent;color:inherit}
    .main{background:rgba(255,255,255,0.02);border-radius:12px;padding:18px;min-height:60vh}
    .main-header{display:flex;justify-content:space-between;align-items:center}
    .main-header h2{margin:0}
    .card{background:var(--card);padding:18px;border-radius:10px;box-shadow:0 6px 18px rgba(3,10,18,0.15)}
    .card h3{margin:0 0 8px 0}
    .meta{color:var(--muted);font-size:0.9rem;margin-bottom:10px}
    .excerpt{color:var(--text);font-size:1rem}
    .readmore{display:inline-block;margin-top:12px;color:var(--accent);text-decoration:none}
    @media (max-width:880px){.container{grid-template-columns:1fr;padding:12px}.sidebar{height:auto;position:relative}.theme-control{right:8px}}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <div class="theme-control">
    <label for="theme-select" class="sr-only">Choose theme</label>
    <select id="theme-select" class="theme-select" aria-label="Choose theme">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <div class="container">
    <aside class="sidebar" aria-label="Site navigation">
      <div class="brand">
        <div class="logo">PM</div>
        <div>
          <h1>Paurush M Taunk</h1>
          <div class="muted">my-web-wiki</div>
        </div>
      </div>

      <div class="search" role="search">
        <input id="search" placeholder="Search posts..." aria-label="Search posts" />
      </div>

    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <h2>Latest</h2>
          <div class="muted">One recent post</div>
        </div>
      </div>

      <article class="card" id="post-1" data-title="Agent steering &amp; skills" data-excerpt="Agent steering and agent skills provide consistent behavior and focused context in Kiro.">
        <h3>Working with Amazon Kiro IDE</h3>
        <div class="meta">Jul 16, 2026 · Guide</div>
        <p class="excerpt">Key benefits of Agent Steering and Agent skills</p>
        <a class="readmore" href="/my-web-wiki/posts/agent-steering-and-skills.html">Read more →</a>
      </article>

    </main>
  </div>

  <script>
    // Theme handling: 'system' | 'light' | 'dark'
    (function(){
      const select = document.getElementById('theme-select');
      const storageKey = 'site-theme-preference';
      const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme(pref){ if(pref === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', pref); }
      function readStored(){ return localStorage.getItem(storageKey) || 'system'; }
      function store(pref){ if(pref === 'system') localStorage.removeItem(storageKey); else localStorage.setItem(storageKey, pref); }
      const stored = readStored(); select.value = stored; applyTheme(stored);
      select.addEventListener('change', (e)=>{ const v = e.target.value; store(v); applyTheme(v); });
      function handleSystemChange(){ if(readStored() === 'system') applyTheme('system'); }
      if(mq){ if(typeof mq.addEventListener === 'function') mq.addEventListener('change', handleSystemChange); else if(typeof mq.addListener === 'function') mq.addListener(handleSystemChange); }
    })();

    (function(){
      const input = document.getElementById('search');
      const post = document.getElementById('post-1');
      input.addEventListener('input', e => {
        const q = e.target.value.toLowerCase().trim();
        const title = (post.dataset.title || '').toLowerCase();
        const excerpt = (post.dataset.excerpt || '').toLowerCase();
        const show = q === '' || title.includes(q) || excerpt.includes(q);
        post.style.display = show ? '' : 'none';
      });
    })();
  </script>
</body>
</html>
